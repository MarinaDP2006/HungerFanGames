name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'La_Cosecha_Juego_Android/**'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: La_Cosecha_Juego_Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: node tests/smoke.mjs
      - run: node tests/campaigns.mjs
      - run: npm run build:web
      - run: '[ -f android/gradlew ] || (rm -rf android && npx cap add android)'
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: La-Cosecha-Android-debug
          path: La_Cosecha_Juego_Android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
