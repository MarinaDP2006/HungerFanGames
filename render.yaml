services:
  - type: web
    name: la-cosecha-web
    runtime: static
    rootDir: La_Cosecha_Web_Render
    buildCommand: ""
    staticPublishPath: .
    autoDeploy: true
    buildFilter:
      paths:
        - La_Cosecha_Web_Render/**
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
